<!doctype html>
<!--
  Cover / social preview for static-gantt (1280×640).
  Re-render from the repo root with headless Edge:
    msedge --headless=new --disable-gpu --hide-scrollbars --window-size=1280,640 \
      --screenshot=docs/images/cover.png docs/images/cover.html
  The chart on the right is the app's own screenshot (screenshot-dark.png in this folder).
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>static-gantt cover</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    color: #e2e8f0;
    background:
      radial-gradient(900px 500px at 85% 20%, rgba(99, 102, 241, 0.28), transparent 60%),
      radial-gradient(700px 420px at 10% 100%, rgba(16, 185, 129, 0.18), transparent 60%),
      #0b1120;
    position: relative;
  }
  .copy { position: absolute; left: 72px; top: 92px; width: 520px; }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 700; color: #a5b4fc;
    letter-spacing: 0.5px;
  }
  .badge i { width: 34px; height: 34px; border-radius: 10px; background: #6366f1; display: inline-grid; place-items: center; }
  .badge i::before { content: ""; width: 16px; height: 12px; border-top: 3px solid #fff; border-bottom: 3px solid #fff; }
  h1 { font-size: 84px; font-weight: 800; letter-spacing: -2px; margin-top: 26px; color: #fff; line-height: 1; }
  .tagline { font-size: 32px; font-weight: 700; margin-top: 22px; color: #f8fafc; line-height: 1.3; }
  .points { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
  .points span { font-size: 22px; color: #cbd5e1; display: flex; align-items: center; gap: 12px; }
  .points span::before { content: ""; width: 26px; height: 10px; border-radius: 5px; background: var(--c); flex: none; }
  .foot { position: absolute; left: 72px; bottom: 46px; font-size: 20px; color: #94a3b8; }
  .shot {
    position: absolute; right: -150px; top: 70px; width: 820px; height: 500px;
    border-radius: 18px; overflow: hidden;
    border: 1px solid rgba(148, 163, 184, 0.35);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 8px rgba(99, 102, 241, 0.10);
    transform: perspective(1600px) rotateY(-14deg) rotateX(4deg);
    transform-origin: left center;
  }
  .shot img { width: 1280px; position: absolute; left: -330px; top: -70px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="badge"><i></i>Gantt Studio</div>
    <h1>static-gantt</h1>
    <p class="tagline">在瀏覽器裡排專案時程<br>拖一拖，或寫成 Mermaid</p>
    <div class="points">
      <span style="--c:#10b981">拖曳排程、相依關係、關鍵路徑</span>
      <span style="--c:#6366f1">Mermaid 文字雙向同步</span>
      <span style="--c:#f59e0b">PNG / Excel 匯出，資料只存在本機</span>
    </div>
  </div>
  <div class="foot">natlee.github.io/static-gantt</div>
  <div class="shot"><img src="screenshot-dark.png" alt=""></div>
</body>
</html>
