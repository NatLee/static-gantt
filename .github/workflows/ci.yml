name: CI

# Lint, type-check, unit tests, a production build, and a browser smoke test against that build.
# Runs on every pull request; the Pages workflow calls it before deploying, so main is tested too.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Build and serve under the same path GitHub Pages uses, so the smoke test covers it.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests, east of, at and west of UTC
        run: |
          for tz in Asia/Taipei UTC America/New_York; do
            echo "::group::TZ=$tz"
            TZ=$tz npm test
            echo "::endgroup::"
          done
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the Playwright report when the smoke test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
